name: Sync WHOOP Biometrics Telemetry

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pull-whoop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx

      - name: Fetch Recovery & Sleep Metrics
        env:
          CLIENT_ID: ${{ secrets.WHOOP_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.WHOOP_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.WHOOP_REFRESH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          import os, json, subprocess, httpx
          from datetime import datetime, timezone

          client_id = os.environ.get("CLIENT_ID", "").strip()
          client_secret = os.environ.get("CLIENT_SECRET", "").strip()
          refresh_token = os.environ.get("REFRESH_TOKEN", "").strip()

          if not client_id or not client_secret or not refresh_token:
              raise ValueError("Missing WHOOP secrets!")

          # 1. Refresh OAuth Token (RFC 6749 form-encoded client_secret_post)
          token_payload = {
              "grant_type": "refresh_token",
              "refresh_token": refresh_token,
              "client_id": client_id,
              "client_secret": client_secret,
              "scope": "offline"
          }

          token_res = httpx.post(
              "https://api.prod.whoop.com/oauth/oauth2/token",
              data=token_payload,
              headers={"Content-Type": "application/x-www-form-urlencoded"},
              timeout=20.0
          )

          tokens = token_res.json()
          print(f"WHOOP Auth Status: {token_res.status_code}")
          if token_res.status_code != 200:
              print(f"WHOOP Auth Failure: {json.dumps(tokens, indent=2)}")
              token_res.raise_for_status()

          access_token = tokens["access_token"]
          new_refresh = tokens.get("refresh_token")

          # Persist the newly rotated refresh token back to repository secrets
          if new_refresh and new_refresh != refresh_token and os.environ.get("GH_TOKEN"):
              try:
                  subprocess.run(
                      ["gh", "secret", "set", "WHOOP_REFRESH_TOKEN", "--body", new_refresh],
                      check=True
                  )
                  print("Rotated WHOOP_REFRESH_TOKEN successfully updated in GitHub Secrets.")
              except Exception as e:
                  print(f"Notice: Could not auto-update secret via CLI: {e}")

          headers = {"Authorization": f"Bearer {access_token}"}

          # 2. Fetch Latest Recovery Records
          rec_res = httpx.get("https://api.prod.whoop.com/developer/v1/recovery", headers=headers, timeout=20.0)
          print(f"Recovery Endpoint Status: {rec_res.status_code}")

          score_data = {}
          recovery_score = None

          if rec_res.status_code == 200:
              records = rec_res.json().get("records", [])
              if records:
                  score_data = records[0].get("score", {})
                  recovery_score = score_data.get("recovery_score")

          # Fallback to Cycle endpoint if recovery is empty
          if recovery_score is None:
              cycle_res = httpx.get("https://api.prod.whoop.com/developer/v1/cycle", headers=headers, timeout=20.0)
              print(f"Cycle Endpoint Status: {cycle_res.status_code}")
              if cycle_res.status_code == 200:
                  cycles = cycle_res.json().get("records", [])
                  if cycles:
                      score_data = cycles[0].get("score", {})
                      recovery_score = score_data.get("recovery_score")

          if recovery_score is None:
              recovery_score = 50

          hrv_ms = score_data.get("hrv_rmssd_milli", 0.0)
          rhr_bpm = score_data.get("resting_heart_rate", 0.0)
          spo2 = score_data.get("spo2_percentage")
          skin_temp = score_data.get("skin_temp_celsius")

          zone = "YELLOW"
          if recovery_score >= 66:
              zone = "GREEN"
          elif recovery_score < 34:
              zone = "RED"

          telemetry_payload = {
              "updated_at": datetime.now(timezone.utc).isoformat(),
              "recovery_score": recovery_score,
              "hrv_ms": round(float(hrv_ms), 1),
              "rhr_bpm": round(float(rhr_bpm), 1),
              "recovery_zone": zone,
              "spo2_percentage": spo2,
              "skin_temp_celsius": skin_temp
          }

          os.makedirs("data/telemetry", exist_ok=True)
          with open("data/telemetry/whoop.json", "w") as f:
              json.dump(telemetry_payload, f, indent=2)

          print(f"Successfully synced WHOOP: {recovery_score}% ({zone} Zone) | HRV: {hrv_ms}ms")
        shell: python

      - name: Commit Telemetry
        run: |
          git config user.name "Cyber Dojo Sensei"
          git config user.email "cyberdojosensei@gmail.com"
          git add data/telemetry/whoop.json
          git diff-index --quiet HEAD || (git commit -m "chore(telemetry): sync WHOOP recovery [skip ci]" && git push)
