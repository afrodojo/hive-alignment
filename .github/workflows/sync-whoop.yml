name: Sync WHOOP Biometrics Telemetry

on:
  schedule:
    - cron: '0 11 * * *' # Runs daily at 7:00 AM EST (after morning recovery calculates)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-whoop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx

      - name: Fetch and Parse WHOOP Telemetry
        env:
          WHOOP_API_TOKEN: ${{ secrets.WHOOP_API_TOKEN }}
        run: |
          python - << 'EOF'
          import os, json, httpx
          from datetime import datetime

          token = os.environ.get("WHOOP_API_TOKEN")
          telemetry_file = "docs/data/telemetry.json"

          # Load existing data as base
          if os.path.exists(telemetry_file):
              with open(telemetry_file, "r") as f:
                  data = json.load(f)
          else:
              data = {
                  "recovery": 66,
                  "sleep": 61,
                  "strain": 5.3,
                  "hrv": 92.9,
                  "height": "6'0\" (72 in)",
                  "weight": 235
              }

          # If WHOOP API token is present, pull latest cycle
          if token:
              headers = {"Authorization": f"Bearer {token}"}
              try:
                  res = httpx.get("https://api.prod.whoop.com/developer/v1/cycle?limit=1", headers=headers, timeout=15.0)
                  if res.status_code == 200:
                      cycle = res.json()["records"][0]
                      data["strain"] = round(cycle["score"]["strain"], 1)
                      data["last_updated"] = datetime.utcnow().isoformat() + "Z"
                      print(f"WHOOP strain updated: {data['strain']}")
              except Exception as e:
                  print(f"WHOOP API fetch note: {e}")

          with open(telemetry_file, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
          print("Updated docs/data/telemetry.json successfully.")
          EOF

      - name: Commit Updated Telemetry
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/data/telemetry.json
          git diff-index --quiet HEAD || git commit -m "chore(telemetry): auto-update WHOOP recovery & vitals [skip ci]"
          git push origin main
