name: Sync WHOOP Biometrics Telemetry

on:
  schedule:
    # 07:15 AM EDT (11:15 UTC), 01:15 PM EDT (17:15 UTC), 09:15 PM EDT (01:15 UTC next day)
    - cron: '15 11,17,1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-whoop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx

      - name: Fetch and Sync Live WHOOP Data
        env:
          WHOOP_CLIENT_ID: ${{ secrets.WHOOP_CLIENT_ID }}
          WHOOP_CLIENT_SECRET: ${{ secrets.WHOOP_CLIENT_SECRET }}
          WHOOP_REFRESH_TOKEN: ${{ secrets.WHOOP_REFRESH_TOKEN }}
        run: |
          python - << 'EOF'
          import os, json, httpx
          from datetime import datetime

          client_id = os.environ.get("WHOOP_CLIENT_ID")
          client_secret = os.environ.get("WHOOP_CLIENT_SECRET")
          refresh_token = os.environ.get("WHOOP_REFRESH_TOKEN")

          telemetry_file = "docs/data/telemetry.json"

          # 1. Load existing base data
          if os.path.exists(telemetry_file):
              with open(telemetry_file, "r", encoding="utf-8-sig") as f:
                  data = json.load(f)
          else:
              data = {
                  "recovery": 66,
                  "sleep": 61,
                  "strain": 5.3,
                  "hrv": 92.9,
                  "height": "6'0\" (72 in)",
                  "weight": 235,
                  "schedule": "Monday – Friday"
              }

          # 2. Exchange refresh token for fresh access token (without scope)
          access_token = None
          if client_id and client_secret and refresh_token:
              token_url = "https://api.prod.whoop.com/oauth/oauth2/token"
              payload = {
                  "grant_type": "refresh_token",
                  "refresh_token": refresh_token.strip(),
                  "client_id": client_id.strip(),
                  "client_secret": client_secret.strip()
              }
              headers_token = {
                  "Content-Type": "application/x-www-form-urlencoded"
              }
              try:
                  token_res = httpx.post(token_url, data=payload, headers=headers_token, timeout=20.0)
                  if token_res.status_code == 200:
                      token_payload = token_res.json()
                      access_token = token_payload.get("access_token")
                      print("SUCCESS: WHOOP Access Token refreshed.")
                  else:
                      print(f"ERROR: Token refresh failed ({token_res.status_code}): {token_res.text}")
              except Exception as e:
                  print(f"ERROR: Token refresh network exception: {e}")
          else:
              print("WARNING: Missing one or more WHOOP secrets in GitHub repository.")

          # 3. Query telemetry endpoints
          if access_token:
              headers = {"Authorization": f"Bearer {access_token}"}
              base_url = "https://api.prod.whoop.com/developer/v1"

              # Recovery
              try:
                  r = httpx.get(f"{base_url}/recovery?limit=1", headers=headers, timeout=20.0)
                  print(f"Recovery Endpoint Status: {r.status_code}")
                  if r.status_code == 200 and r.json().get("records"):
                      score = r.json()["records"][0].get("score", {})
                      if "recovery_score" in score:
                          data["recovery"] = int(round(score["recovery_score"]))
                      if "hrv_rmssd_milli" in score:
                          data["hrv"] = round(score["hrv_rmssd_milli"], 1)
                      if "resting_heart_rate" in score:
                          data["rhr"] = int(round(score["resting_heart_rate"]))
                      print(f"-> Set Recovery: {data.get('recovery')}% | HRV: {data.get('hrv')} ms | RHR: {data.get('rhr')} bpm")
              except Exception as e:
                  print(f"Recovery Fetch Error: {e}")

              # Sleep
              try:
                  s = httpx.get(f"{base_url}/activity/sleep?limit=1", headers=headers, timeout=20.0)
                  print(f"Sleep Endpoint Status: {s.status_code}")
                  if s.status_code == 200 and s.json().get("records"):
                      s_score = s.json()["records"][0].get("score", {})
                      if "sleep_performance_percentage" in s_score:
                          data["sleep"] = int(round(s_score["sleep_performance_percentage"]))
                      print(f"-> Set Sleep: {data.get('sleep')}%")
              except Exception as e:
                  print(f"Sleep Fetch Error: {e}")

              # Day Strain
              try:
                  c = httpx.get(f"{base_url}/cycle?limit=1", headers=headers, timeout=20.0)
                  print(f"Cycle Endpoint Status: {c.status_code}")
                  if c.status_code == 200 and c.json().get("records"):
                      c_score = c.json()["records"][0].get("score", {})
                      if "strain" in c_score:
                          data["strain"] = round(c_score["strain"], 1)
                      print(f"-> Set Day Strain: {data.get('strain')}")
              except Exception as e:
                  print(f"Cycle Fetch Error: {e}")

          data["last_updated"] = datetime.utcnow().isoformat() + "Z"
          data["height"] = "6'0\" (72 in)"
          data["weight"] = 235

          os.makedirs("docs/data", exist_ok=True)
          with open(telemetry_file, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)

          print(f"Wrote docs/data/telemetry.json at {data['last_updated']}")
          EOF

      - name: Commit Updated Telemetry
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/data/telemetry.json
          git diff-index --quiet HEAD || git commit -m "chore(telemetry): auto-sync live WHOOP biometrics [skip ci]"
          git push origin main