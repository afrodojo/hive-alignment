name: Sync WHOOP Biometrics Telemetry

on:
  schedule:
    # Runs at 10:00 UTC (6:00 AM EDT) daily
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pull-whoop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx

      - name: Fetch Recovery & Sleep Metrics
        env:
          CLIENT_ID: ${{ secrets.WHOOP_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.WHOOP_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.WHOOP_REFRESH_TOKEN }}
        run: |
          import os, json, httpx
          from datetime import datetime, timezone

          client_id = os.environ.get("CLIENT_ID", "").strip()
          client_secret = os.environ.get("CLIENT_SECRET", "").strip()
          refresh_token = os.environ.get("REFRESH_TOKEN", "").strip()

          if not client_id or not client_secret or not refresh_token:
              raise ValueError("One or more WHOOP secrets are missing or empty.")

          # WHOOP requires redirect_uri even on refresh_token requests
          token_payload = {
              "grant_type": "refresh_token",
              "refresh_token": refresh_token,
              "client_id": client_id,
              "client_secret": client_secret,
              "redirect_uri": "https://httpbin.org/anything"
          }

          token_res = httpx.post(
              "https://api.prod.whoop.com/oauth/oauth2/token",
              data=token_payload,
              headers={"Content-Type": "application/x-www-form-urlencoded"},
              timeout=20.0
          )

          print(f"WHOOP Auth Status: {token_res.status_code}")
          try:
              tokens = token_res.json()
          except Exception:
              tokens = {"raw": token_res.text}

          if token_res.status_code != 200:
              print("WHOOP Token Refresh Failed:")
              print(json.dumps(tokens, indent=2))
              token_res.raise_for_status()

          access_token = tokens["access_token"]
          new_refresh = tokens.get("refresh_token")
          if new_refresh and new_refresh != refresh_token:
              print("Notice: WHOOP issued a rotated refresh_token.")

          # 2. Fetch Latest Recovery
          headers = {"Authorization": f"Bearer {access_token}"}
          rec_res = httpx.get("https://api.prod.whoop.com/developer/v1/recovery?limit=1", headers=headers, timeout=20.0)

          print(f"WHOOP Recovery Endpoint Code: {rec_res.status_code}")
          if rec_res.status_code != 200:
              print(f"WHOOP Recovery Error: {rec_res.text}")
              rec_res.raise_for_status()

          records = rec_res.json().get("records", [])
          if not records:
              print("No recovery records returned yet today.")
              exit(0)

          score = records[0].get("score", {})
          recovery_score = score.get("recovery_score", 50)
          hrv_ms = score.get("hrv_rmssd_milli", 0)
          rhr_bpm = score.get("resting_heart_rate", 0)

          zone = "YELLOW"
          if recovery_score >= 66:
              zone = "GREEN"
          elif recovery_score < 34:
              zone = "RED"

          telemetry_payload = {
              "updated_at": datetime.now(timezone.utc).isoformat(),
              "recovery_score": recovery_score,
              "hrv_ms": round(hrv_ms, 1),
              "rhr_bpm": round(rhr_bpm, 1),
              "recovery_zone": zone,
              "spo2_percentage": score.get("spo2_percentage", None),
              "skin_temp_celsius": score.get("skin_temp_celsius", None)
          }

          os.makedirs("data/telemetry", exist_ok=True)
          with open("data/telemetry/whoop.json", "w") as f:
              json.dump(telemetry_payload, f, indent=2)

          print(f"Successfully synced WHOOP: {recovery_score}% ({zone} Zone) | HRV: {hrv_ms}ms")
        shell: python

      - name: Commit Telemetry
        run: |
          git config user.name "Cyber Dojo Sensei"
          git config user.email "cyberdojosensei@gmail.com"
          git add data/telemetry/whoop.json
          git diff-index --quiet HEAD || (git commit -m "chore(telemetry): sync WHOOP recovery [skip ci]" && git push)
