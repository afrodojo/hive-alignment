name: Build, Secure & Notify Central Hub

on:
  push:
    branches: [main, master]

permissions:
  contents: read
  packages: write

jobs:
  security-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

      - name: Semgrep SAST Scan
        run: |
          pip install --quiet semgrep
          semgrep scan --config auto --quiet

      - name: Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  build-and-push:
    needs: security-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Spoke Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

  dispatch-to-hub:
    needs: build-and-push
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Central Hub Assembly
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.HUB_DISPATCH_TOKEN }}
          repository: afrodojo/platform-hub
          event-type: spoke-updated
          client-payload: '{"service": "${{ github.event.repository.name }}", "language": "python", "sha": "${{ github.sha }}"}'