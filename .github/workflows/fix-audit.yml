name: Batch Fix Vulnerabilities

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fix Dependencies
        run: |
          npm audit fix --force || npm audit fix

      - name: Push Patched Files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff-index --quiet HEAD || (git commit -m "fix(deps): batch patch remaining vulnerabilities [skip ci]" && git push)
